# Optional: publish src/ to GitHub Pages for demos and sideload testing.
# Enable Pages in the repository settings (Source: GitHub Actions) before running.
# The published manifest points at https://<owner>.github.io/<repo>/ .
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site and point the manifest at the Pages host
        run: |
          mkdir -p _site
          cp -r src/. _site/
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="${{ github.event.repository.name }}"
          sed -i "s#https://addin.example.com#https://${owner}.github.io/${repo}#g" _site/manifest.xml
          echo "Manifest URLs now use https://${owner}.github.io/${repo}"
          grep -c "${owner}.github.io" _site/manifest.xml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
